<header class="bg-marine">
  <div
    class="mx-auto flex h-[60px] max-w-[1240px] items-center gap-6 px-4 sm:px-7 md:h-[72px] lg:px-10"
  >
    <si-marque />
    <a
      class="text-ciel ml-auto inline-flex items-center gap-1.5 text-[0.92rem] no-underline hover:text-white hover:underline hover:underline-offset-4"
      [href]="destination()"
      (click)="$event.preventDefault(); rentrer()"
    >
      <ng-icon name="siFermer" size="18" />
      <span class="max-sm:sr-only">{{
        versAnnonce() ? textes.retourAnnonce : textes.retourAccueil
      }}</span>
    </a>
  </div>
</header>

<div class="grid min-h-[calc(100svh-72px)] lg:grid-cols-[minmax(0,5fr)_minmax(0,6fr)]">
  <si-promesse-connexion />

  <main
    class="flex justify-center px-4 pt-7 pb-11 sm:px-7 sm:pt-10 sm:pb-14 lg:px-10 lg:pt-14 lg:pb-[72px]"
  >
    <div class="w-full max-w-[460px]">
      @if (contexte; as c) {
        <div
          class="border-ciel bg-brume mb-7 grid grid-cols-[64px_1fr] items-center gap-3.5 rounded-cadre border p-3"
        >
          @if (c.photo) {
            <img [src]="c.photo" alt="" class="size-16 rounded-champ object-cover" />
          } @else {
            <span class="bg-glace size-16 rounded-champ"></span>
          }
          <p class="text-encre-2 text-[0.9rem]">
            <b class="text-foreground font-semibold">{{ c.titre }}</b
            ><br />{{ textes.contexte(c.action) }}
          </p>
        </div>
      }

      <h1 class="font-display text-[2rem] leading-[1.05] font-semibold sm:text-[2.3rem]">
        {{ titre() }}
      </h1>
      <p class="text-encre-2 mt-2">{{ chapeau() }}</p>

      <div hlmTabs [tab]="onglet()" (tabActivated)="changerOnglet($event)" class="mt-[26px]">
        <div
          hlmTabsList
          class="border-border grid h-auto w-full grid-cols-2 rounded-none border-b bg-transparent p-0"
        >
          <button hlmTabsTrigger="connexion" class="onglet">{{ textes.ongletConnexion }}</button>
          <button hlmTabsTrigger="inscription" class="onglet">
            {{ textes.ongletInscription }}
          </button>
        </div>
        <div hlmTabsContent="connexion" class="pt-6">
          <si-formulaire-connexion
            (reussi)="rentrer()"
            (versInscription)="changerOnglet('inscription')"
          />
        </div>
        <div hlmTabsContent="inscription" class="pt-6">
          <si-formulaire-inscription
            (reussi)="rentrer()"
            (versConnexion)="changerOnglet('connexion')"
          />
        </div>
      </div>

      <p class="border-border text-encre-3 mt-7 border-t pt-4 text-[0.82rem]">
        {{ textes.securite }}
      </p>
    </div>
  </main>
</div>
