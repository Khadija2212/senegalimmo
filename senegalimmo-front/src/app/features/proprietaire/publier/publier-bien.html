<main class="mx-auto max-w-[820px] px-4 pb-24 sm:px-7">
  <a
    [routerLink]="cheminEspace"
    [queryParams]="{ rubrique: 'biens' }"
    class="text-encre-2 hover:text-bleu-vif mt-6 inline-flex items-center gap-1.5 text-[0.9rem] font-medium"
  >
    <ng-icon name="siGauche" size="18" />{{ t.retour }}
  </a>
  <h1 class="font-display mt-4 text-[clamp(2rem,3.4vw,2.8rem)] leading-[1.05] font-semibold">
    {{ t.titre }}
  </h1>
  <p class="text-encre-2 mt-2 max-w-[60ch]">{{ t.intro }}</p>

  <form class="mt-8" novalidate (submit)="$event.preventDefault(); envoyer()">
    <section class="border-border border-t pt-6" aria-labelledby="t-bien">
      <h2 id="t-bien" class="font-display text-[1.55rem] leading-tight font-semibold">
        <span class="text-encre-3 font-sans text-[0.95rem] font-semibold tabular-nums">1</span>
        {{ t.etapeBien }}
      </h2>
      @if (publication.bienId()) {
        <p class="text-succes mt-2 text-[0.9rem] font-medium" role="status">
          {{ t.bienEnregistre }}
        </p>
      }
      <si-champs-bien class="mt-5" [form]="bien" />
    </section>

    <section class="border-border mt-10 border-t pt-6" aria-labelledby="t-annonce">
      <h2 id="t-annonce" class="font-display text-[1.55rem] leading-tight font-semibold">
        <span class="text-encre-3 font-sans text-[0.95rem] font-semibold tabular-nums">2</span>
        {{ t.etapeAnnonce }}
      </h2>
      <si-champs-annonce class="mt-5" [form]="annonce" />
    </section>

    <section class="border-border mt-10 border-t pt-6" aria-labelledby="t-photos">
      <h2 id="t-photos" class="font-display text-[1.55rem] leading-tight font-semibold">
        <span class="text-encre-3 font-sans text-[0.95rem] font-semibold tabular-nums">3</span>
        {{ t.etapePhotos }}
      </h2>
      <si-choix-photos class="mt-3" [(photos)]="photos" [envoyees]="publication.photosEnvoyees()" />
    </section>

    <div class="border-border mt-10 border-t pt-6">
      @if (alerte(); as a) {
        <p
          class="border-destructive bg-alerte text-alerte-texte mb-5 rounded-r-lg border-l-[3px] px-3.5 py-3 text-[0.9rem]"
          role="alert"
        >
          {{ a }}
        </p>
      }
      <button
        hlmBtn
        type="submit"
        size="grand"
        class="h-[52px] w-full sm:w-auto"
        [disabled]="enCours()"
        [attr.aria-busy]="enCours()"
      >
        {{ libelleEnvoi() }}
      </button>
      <p class="text-encre-3 mt-3 text-[0.85rem]">{{ t.noteModeration }}</p>
    </div>
  </form>
</main>
