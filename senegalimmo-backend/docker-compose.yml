version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: senegalimmo_db
    environment:
      POSTGRES_DB: senegalimmo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Passer123
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: